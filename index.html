<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Cat Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="fx-overlay" class="fx-overlay">
        <div id="scratch-marks" class="scratch-container">
            <div class="scratch scratch-1"></div>
            <div class="scratch scratch-2"></div>
            <div class="scratch scratch-3"></div>
        </div>
        <div id="kill-text" class="arcade-text"></div>
    </div>

    <div class="game-container">
        <h1>🐾 Cat Tactical Chess 🐾</h1>
        <h2>Turn: <span id="turn-display">White</span></h2>
        <div id="chessboard"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
